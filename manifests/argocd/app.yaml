apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: urlshort
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Vishnu063/urlshort.git
    targetRevision: main
    path: manifests/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: urlshort
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
