apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urlshort
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urlshort
                port:
                  number: 80
